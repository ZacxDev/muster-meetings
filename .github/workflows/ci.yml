name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks (the whole history, .gitleaks.toml)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact .
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # A real livekit-server and LiveKit's CLI for the integration test
      # (internal/server/livekit_integration_test.go) and its mutant: pinned
      # releases, checked by SHA-256. MEETINGS_REQUIRE_LIVEKIT=1 makes the
      # test fail, not skip, if they are missing.
      - name: livekit-server and lk (pinned)
        env:
          LIVEKIT_VERSION: 1.13.11
          LIVEKIT_SHA256: 1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb
          LK_VERSION: 2.19.4
          LK_SHA256: cb0f769201faa13956a3999bee078ec63fd5f22b855a79c09d648283e50debae
        run: |
          mkdir -p /tmp/lk
          curl -sSfL -o /tmp/lks.tgz "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          echo "${LIVEKIT_SHA256}  /tmp/lks.tgz" | sha256sum -c -
          curl -sSfL -o /tmp/lkcli.tgz "https://github.com/livekit/livekit-cli/releases/download/v${LK_VERSION}/lk_${LK_VERSION}_linux_amd64.tar.gz"
          echo "${LK_SHA256}  /tmp/lkcli.tgz" | sha256sum -c -
          tar -xzf /tmp/lks.tgz -C /tmp/lk livekit-server
          tar -xzf /tmp/lkcli.tgz -C /tmp/lk lk
          echo "MEETINGS_LIVEKIT_SERVER=/tmp/lk/livekit-server" >> "$GITHUB_ENV"
          echo "MEETINGS_LK_CLI=/tmp/lk/lk" >> "$GITHUB_ENV"
          echo "MEETINGS_REQUIRE_LIVEKIT=1" >> "$GITHUB_ENV"
      # kubectl renders deploy/kubernetes for ./deploy's tests and their
      # mutants (MEETINGS_REQUIRE_KUBECTL=1: fail, never skip); kubeconform
      # checks the rendered objects against the Kubernetes schemas. Both
      # pinned, checked by SHA-256.
      - name: kubectl and kubeconform (pinned)
        env:
          KUBECTL_VERSION: v1.37.2
          KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          mkdir -p /tmp/k8s
          curl -sSfL -o /tmp/k8s/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/k8s/kubectl" | sha256sum -c -
          chmod +x /tmp/k8s/kubectl
          curl -sSfL -o /tmp/kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp/k8s kubeconform
          echo "/tmp/k8s" >> "$GITHUB_PATH"
          echo "MEETINGS_REQUIRE_KUBECTL=1" >> "$GITHUB_ENV"
      # ffmpeg for the frame sampling tests (internal/frames, the timeline's
      # frame route) and their mutants: MEETINGS_REQUIRE_FFMPEG=1 makes them
      # fail, not skip, without it.
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1
          echo "MEETINGS_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
      - name: render and validate deploy/kubernetes and the example overlay
        run: |
          for d in deploy/kubernetes deploy/example-overlay; do
            kubectl kustomize "$d" > /tmp/rendered.yaml
            kubeconform -strict -summary /tmp/rendered.yaml
          done
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: security-gate mutation sweep (each gate's mutant must turn its named test red)
        run: go run ./scripts/mutate

  e2e:
    name: e2e (playwright, chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # A real livekit-server for owner-two-devices.spec.ts (pinned, SHA-256);
      # MEETINGS_REQUIRE_LIVEKIT=1 makes that spec fail, not skip, without it.
      - name: livekit-server (pinned)
        env:
          LIVEKIT_VERSION: 1.13.11
          LIVEKIT_SHA256: 1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb
        run: |
          mkdir -p /tmp/lk
          curl -sSfL -o /tmp/lks.tgz "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          echo "${LIVEKIT_SHA256}  /tmp/lks.tgz" | sha256sum -c -
          tar -xzf /tmp/lks.tgz -C /tmp/lk livekit-server
          echo "MEETINGS_LIVEKIT_SERVER=/tmp/lk/livekit-server" >> "$GITHUB_ENV"
          echo "MEETINGS_REQUIRE_LIVEKIT=1" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: e2e
        run: npm ci
      - name: install chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # The /enter frame gate in a real browser (a top-level load is refused
      # with no redeem; the same code framed by a muster-like parent works),
      # the lobby at 390x844 (a guest knocks, the owner admits, the guest
      # connects to the fake LiveKit with a guest token, and Retry reconnects
      # without a knock), a second owner device against a real LiveKit, and
      # the transcript in the owner's and a guest's panels (the fake LiveKit
      # as Egress, the fake STT engine), and live captions at 390x844 and
      # 1280x800 (the nemotron engine against the fake Nemotron server), and
      # a late closing mark amending a shown line in place (late-marks), and
      # the recording (recording.spec.ts: the badge for the owner and a guest
      # at both sizes, the archive's seek on a line click, the share link).
      # The UI pass (ui-*.spec.ts): the pre-join, the tile indicators, the
      # speaking ring, the layouts and screen share, the connection quality,
      # the shortcuts, reduced motion, accessible names, axe, and muster's UI
      # kit (served by the harness from e2e/fixtures/ui-kit) and its fallback;
      # the indicators and a screen share against the real livekit-server.
      # Count the passes: `playwright test` exits 0 when everything skipped.
      - name: playwright test
        working-directory: e2e
        run: |
          set -o pipefail
          npx playwright test --project=chromium 2>&1 | tee /tmp/e2e.log
          grep -qE '^\s+56 passed \(' /tmp/e2e.log
      # The UI mutants: each must turn its named Playwright test red (and the
      # no-op control must not).
      - name: UI mutation sweep (each UI mutant's named Playwright test must go red)
        run: go run ./scripts/mutate -e2e

  # The visual goldens (e2e/goldens/), compared in the pinned Playwright
  # image, where the fonts and the rasteriser are the ones they were made
  # with (scripts/update-goldens.sh makes them in the same image).
  visual:
    name: visual goldens (playwright image)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: npm ci
        working-directory: e2e
        run: npm ci
      - name: playwright test (visual)
        working-directory: e2e
        env:
          HOME: /root
          GOFLAGS: -buildvcs=false
        run: |
          set -o pipefail
          npx playwright test --project=visual 2>&1 | tee /tmp/visual.log
          grep -qE '^\s+2 passed \(' /tmp/visual.log
      - name: the diffs, on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: e2e/test-results/
