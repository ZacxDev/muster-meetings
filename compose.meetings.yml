# muster-meetings for muster's Docker Compose stack: a FRAGMENT, used beside
# muster's own file, so its services join muster's project. muster's file is
# unchanged.
#
#   docker compose -f docker-compose.yml -f compose.meetings.yml --profile meetings up -d
#
# Phase 2c: the plugin and LiveKit (TURN over TLS only). Phase 3a: Egress
# (each microphone's raw PCM to the plugin's ingest) and its own Redis. The
# transcript's STT is muster's own stt-cohere (its compose profile), which
# the plugin's utterance engine calls as dictation does.
#
# Set in muster's .env (every value is empty unless set; the plugin refuses
# to start on a missing one and names it):
#   MEETINGS_MUSTER_URL       optional: where the plugin calls muster. Default
#                             http://muster:8105, muster's own service on its
#                             network (allowed because MEETINGS_MUSTER_HTTP_HOST
#                             names exactly `muster`); the token never passes a CDN
#   MEETINGS_MUSTER_ORIGIN    muster's origin as browsers see it
#   MEETINGS_PLUGIN_TOKEN     the mpl_… token `muster-server app install` printed
#   MEETINGS_LINK_KEY         openssl rand -base64 32
#   MEETINGS_PUBLIC_URL       https://meet-<x>.<domain>
#   MEETINGS_LIVEKIT_URL      wss://meet-rtc-<x>.<domain>
#   MEETINGS_TURN_DOMAIN      meet-turn-<x>.<domain>
#   MEETINGS_TURN_CERT_DIR    a directory holding tls.crt and tls.key: a
#                             PUBLICLY TRUSTED certificate for the TURN host,
#                             readable by uid 65532
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#   MEETINGS_INGEST_SECRET    openssl rand -base64 32 (the ingest URL tokens' key)
#   MEETINGS_STT_ENGINE       optional: utterance (the default), nemotron or off
#   MEETINGS_STT_URL          optional: default http://stt-cohere:8000 (muster's
#                             stt-cohere profile); nemotron's fallback too
#   MEETINGS_STT_TOKEN        stt-cohere's bearer: the same value as muster's
#                             MUSTER_STT_TOKEN
#   MEETINGS_STREAM_STT_URL   nemotron only: the stt-nemotron server's
#                             ws(s)://host:port/v1/stream (no default: this
#                             stack runs no stt-nemotron)
#   MEETINGS_STREAM_STT_TOKEN nemotron only: stt-nemotron's STT_API_TOKEN
#   MEETINGS_TRUSTED_PROXIES, MEETINGS_CLIENT_IP_HEADER   (optional; see the README)
#   MEETINGS_S3_ENDPOINT, MEETINGS_S3_BUCKET, MEETINGS_S3_ACCESS_KEY,
#   MEETINGS_S3_SECRET_KEY (and MEETINGS_S3_REGION)  optional, all or none:
#                       the recording's bucket, for the plugin and Egress alike
#                       (README "Recording (optional)")
#   OPENROUTER_API_KEY, MEETINGS_ITEMS_MODEL (and _PROVIDER_PREFS, _EVERY,
#   MEETINGS_VISION_MODEL, _PROVIDER_PREFS), MEETINGS_SMTP_ADDR (and _USER,
#   _PASS, _SERVER_NAME), MEETINGS_MAIL_FROM  optional: the post-call notes
#                             (README "Post-call notes"); no model is none
#   MEETINGS_CONTACTS_URL, MEETINGS_CONTACTS_TOKEN  optional, both or neither:
#                             the contacts plugin's internal API and a COPY of
#                             its CONTACTS_API_TOKEN (README "Contacts
#                             (optional)"); unset, there is no guest card
#
# Published on 127.0.0.1 only, for the stack's reverse proxy on this host:
#   ${MEETINGS_HTTP_PORT:-8106}  the plugin: route https://meet-<x>.<domain> here
#   ${MEETINGS_RTC_PORT:-8107}   LiveKit signalling: route https/wss meet-rtc-<x>.<domain> here
#   ${MEETINGS_TURN_PORT:-8108}  TURN/TLS: an SNI PASSTHROUGH on public 443 for
#                                meet-turn-<x>.<domain> ends here (TLS is NOT
#                                terminated by the proxy; LiveKit terminates it)
# LiveKit's direct media listeners (7881/tcp, the UDP ICE range), the
# plugin's internal port (8081) and its ingest (8082) are not published:
# every client, LAN clients included, connects through TURN over TLS.
#
# The ingest is on an INTERNAL network of its own, meetings-ingest, that only
# the plugin and Egress join, and the plugin listens for it on its address
# there alone (MEETINGS_INGEST_ADDR): nothing else on any network reaches it.
# Redis publishes nothing and is reached by name on the meetings network.
#
# LiveKit has a fixed address on its own network, because rtc.node_ip (where
# TURN allocates relays and the SFU advertises itself) must be its own
# address, and that address is the one private peer TURN may relay to.

services:
  muster-meetings:
    profiles: [meetings]
    image: ${MEETINGS_IMAGE:-ghcr.io/zacxdev/muster-meetings}:${MEETINGS_VERSION:-main}
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      # muster's own service on muster's network, in plain http: allowed
      # only because MEETINGS_MUSTER_HTTP_HOST names exactly that host, so
      # the token never leaves the Compose network or passes a CDN.
      MUSTER_URL: ${MEETINGS_MUSTER_URL:-http://muster:8105}
      MEETINGS_MUSTER_HTTP_HOST: muster
      MUSTER_ORIGIN: ${MEETINGS_MUSTER_ORIGIN:-}
      MUSTER_PLUGIN_TOKEN: ${MEETINGS_PLUGIN_TOKEN:-}
      MEETINGS_LINK_KEY: ${MEETINGS_LINK_KEY:-}
      MEETINGS_PUBLIC_URL: ${MEETINGS_PUBLIC_URL:-}
      MEETINGS_LIVEKIT_URL: ${MEETINGS_LIVEKIT_URL:-}
      MEETINGS_LIVEKIT_API_URL: http://livekit:7880
      MEETINGS_LIVEKIT_ICE: relay
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MEETINGS_TRUSTED_PROXIES: ${MEETINGS_TRUSTED_PROXIES:-}
      MEETINGS_CLIENT_IP_HEADER: ${MEETINGS_CLIENT_IP_HEADER:-}
      # Contacts (optional; both or neither): empty is no guest card.
      MEETINGS_CONTACTS_URL: ${MEETINGS_CONTACTS_URL:-}
      MEETINGS_CONTACTS_TOKEN: ${MEETINGS_CONTACTS_TOKEN:-}
      MEETINGS_S3_ENDPOINT: ${MEETINGS_S3_ENDPOINT:-}
      MEETINGS_S3_BUCKET: ${MEETINGS_S3_BUCKET:-}
      MEETINGS_S3_REGION: ${MEETINGS_S3_REGION:-}
      MEETINGS_S3_ACCESS_KEY: ${MEETINGS_S3_ACCESS_KEY:-}
      MEETINGS_S3_SECRET_KEY: ${MEETINGS_S3_SECRET_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MEETINGS_ITEMS_MODEL: ${MEETINGS_ITEMS_MODEL:-}
      MEETINGS_ITEMS_PROVIDER_PREFS: ${MEETINGS_ITEMS_PROVIDER_PREFS:-}
      MEETINGS_ITEMS_EVERY: ${MEETINGS_ITEMS_EVERY:-}
      MEETINGS_VISION_MODEL: ${MEETINGS_VISION_MODEL:-}
      MEETINGS_VISION_PROVIDER_PREFS: ${MEETINGS_VISION_PROVIDER_PREFS:-}
      MEETINGS_SMTP_ADDR: ${MEETINGS_SMTP_ADDR:-}
      MEETINGS_SMTP_USER: ${MEETINGS_SMTP_USER:-}
      MEETINGS_SMTP_PASS: ${MEETINGS_SMTP_PASS:-}
      MEETINGS_SMTP_SERVER_NAME: ${MEETINGS_SMTP_SERVER_NAME:-}
      MEETINGS_MAIL_FROM: ${MEETINGS_MAIL_FROM:-}
      STATE_DIR: /state
      MEETINGS_STT_ENGINE: ${MEETINGS_STT_ENGINE:-utterance}
      MEETINGS_STT_URL: ${MEETINGS_STT_URL:-http://stt-cohere:8000}
      MEETINGS_STT_TOKEN: ${MEETINGS_STT_TOKEN:-}
      MEETINGS_STREAM_STT_URL: ${MEETINGS_STREAM_STT_URL:-}
      MEETINGS_STREAM_STT_TOKEN: ${MEETINGS_STREAM_STT_TOKEN:-}
      MEETINGS_INGEST_SECRET: ${MEETINGS_INGEST_SECRET:-}
      # The ingest listens on the plugin's address on meetings-ingest only,
      # and Egress is sent there.
      MEETINGS_INGEST_LISTEN: ${MEETINGS_INGEST_ADDR:-172.31.251.2}:8082
      MEETINGS_INGEST_URL: ws://${MEETINGS_INGEST_ADDR:-172.31.251.2}:8082
    volumes:
      - meetings-state:/state
    ports:
      - "${MEETINGS_BIND:-127.0.0.1}:${MEETINGS_HTTP_PORT:-8106}:8080"
    # default: muster's own network, where the names `muster` and
    # `stt-cohere` resolve.
    networks:
      meetings: {}
      default: {}
      meetings-ingest:
        ipv4_address: ${MEETINGS_INGEST_ADDR:-172.31.251.2}
    depends_on: [livekit]

  livekit:
    profiles: [meetings]
    # v1.13.11, pinned by the multi-arch index digest (as deploy/kubernetes).
    image: docker.io/livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50199
          use_external_ip: false
          node_ip: ${MEETINGS_LIVEKIT_IP:-172.31.250.10}
          interfaces:
            includes: [eth0]
        turn:
          enabled: true
          domain: ${MEETINGS_TURN_DOMAIN:-}
          tls_port: 5349
          cert_file: /etc/livekit/turn-tls/tls.crt
          key_file: /etc/livekit/turn-tls/tls.key
          relay_range_start: 40000
          relay_range_end: 40199
          allow_restricted_peer_cidrs: [${MEETINGS_LIVEKIT_IP:-172.31.250.10}/32]
        room:
          auto_create: false
          empty_timeout: 600
          departure_timeout: 600
          max_participants: 8
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls: [http://muster-meetings:8081/livekit/webhook]
        redis:
          address: redis-meetings:6379
        logging:
          level: info
    volumes:
      - ${MEETINGS_TURN_CERT_DIR:-./meetings-turn-tls}:/etc/livekit/turn-tls:ro
    ports:
      - "${MEETINGS_BIND:-127.0.0.1}:${MEETINGS_RTC_PORT:-8107}:7880"
      - "${MEETINGS_BIND:-127.0.0.1}:${MEETINGS_TURN_PORT:-8108}:5349"
    networks:
      meetings:
        ipv4_address: ${MEETINGS_LIVEKIT_IP:-172.31.250.10}

  # LiveKit's Egress (as deploy/kubernetes/egress.yaml: the same config).
  egress:
    profiles: [meetings]
    # v1.15.0, pinned by the multi-arch index digest (as deploy/kubernetes).
    image: docker.io/livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
    restart: unless-stopped
    # Not read_only: its entrypoint recreates PulseAudio's state at every
    # start (deploy/kubernetes/egress.yaml says why).
    user: "1001:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:-}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: redis-meetings:6379
        health_port: 8080
        cpu_cost:
          track_cpu_cost: 0.1
          room_composite_cpu_cost: 2
        storage:
          s3:
            endpoint: "${MEETINGS_S3_ENDPOINT:-}"
            bucket: "${MEETINGS_S3_BUCKET:-}"
            region: "${MEETINGS_S3_REGION:-us-east-1}"
            access_key: "${MEETINGS_S3_ACCESS_KEY:-}"
            secret: "${MEETINGS_S3_SECRET_KEY:-}"
            force_path_style: true
    networks: [meetings, meetings-ingest]
    depends_on: [livekit, redis-meetings]

  # Egress's channel to LiveKit: a Redis of its own, never muster's.
  redis-meetings:
    profiles: [meetings]
    # 7.2.17 (the last BSD-licensed line), pinned by the multi-arch index digest.
    image: docker.io/library/redis:7.2.17-alpine3.22@sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
    restart: unless-stopped
    read_only: true
    user: "999:999"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--port", "6379", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    tmpfs: [/data]
    networks: [meetings]

networks:
  meetings:
    ipam:
      config:
        - subnet: ${MEETINGS_MEDIA_SUBNET:-172.31.250.0/24}
  # The ingest's network: internal (no route out), the plugin and Egress only.
  meetings-ingest:
    internal: true
    ipam:
      config:
        - subnet: ${MEETINGS_INGEST_SUBNET:-172.31.251.0/24}

volumes:
  meetings-state:
