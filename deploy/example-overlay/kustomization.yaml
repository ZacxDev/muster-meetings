# An EXAMPLE tenant overlay: every value a tenant sets, with example.test
# names and documentation addresses (RFC 5737). Copy it into your own
# deployment repository and change the values; do not deploy it as is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# muster's namespace: the plugin and LiveKit run in the muster tenant.
namespace: muster-tenant

resources:
  - ../kubernetes

images:
  - name: ghcr.io/zacxdev/muster-meetings
    # Pin a digest: newTag: main@sha256:<digest>, or a released version.
    newTag: "0.1.0"

configMapGenerator:
  - name: muster-meetings-params
    behavior: merge
    literals:
      - muster-url=http://muster.muster-tenant.svc.cluster.local.:8105
      - cluster-domain=cluster.local
      - muster-origin=https://muster.example.test
      - public-url=https://meet-muster.example.test
      - livekit-url=wss://meet-rtc-muster.example.test
      - turn-domain=meet-turn-muster.example.test
      # Behind a CDN: the ingress's pod CIDR, and the CDN's client header.
      - trusted-proxies=192.0.2.0/24
      - client-ip-header=CF-Connecting-IP
      # muster's stt-cohere Service, as dictation reaches it.
      - stt-engine=utterance
      - stt-url=http://muster-stt-cohere:8000
      # Contacts (optional): the contacts plugin's internal API. With it, the
      # Secret holds MEETINGS_CONTACTS_TOKEN, and the NetworkPolicy patch
      # below lets the plugin reach that port and nothing more.
      - contacts-url=http://muster-contacts:8081
      # The recording (optional): the store (an S3-compatible store reached
      # over a mesh; its address is the NetworkPolicy patches' ipBlock) and
      # its bucket. With them,
      # the Secret holds MEETINGS_S3_ACCESS_KEY and MEETINGS_S3_SECRET_KEY (a
      # key scoped to this bucket alone), and the NetworkPolicy patches below
      # let the plugin and Egress reach the store's port and nothing more.
      - s3-endpoint=http://minio.example.test:9000
      - s3-bucket=meetings
      - s3-region=us-east-1
      # The post-call notes (optional): the models (OpenRouter; the Secret
      # holds OPENROUTER_API_KEY) and the mail server (STARTTLS required; the
      # Secret holds MEETINGS_SMTP_USER and MEETINGS_SMTP_PASS). The
      # NetworkPolicy patches below let the plugin reach OpenRouter over
      # HTTPS and the mail server's port, and nothing more.
      - items-model=deepseek/deepseek-v4.1-flash-1017
      - 'items-provider-prefs={"data_collection":"deny","order":["deepinfra/fp8"],"allow_fallbacks":false}'
      - vision-model=anthropic/claude-haiku-5.5
      - 'vision-provider-prefs={"data_collection":"deny","order":["anthropic"],"allow_fallbacks":false}'
      - smtp-addr=mail.example.test:587
      - mail-from=meetings@mail.example.test

patches:
  # The NodePorts the outside route targets.
  - target: {kind: Service, name: livekit-nodeport}
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30880
      - op: add
        path: /spec/ports/1/nodePort
        value: 30549
  # The PVC's StorageClass.
  - target: {kind: PersistentVolumeClaim, name: muster-meetings-state}
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: example-local
  # The ingress controller's namespace, and muster's pods and port.
  - target: {kind: NetworkPolicy, name: muster-meetings}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {kubernetes.io/metadata.name: example-ingress}
      - op: replace
        path: /spec/egress/0/to/0/podSelector/matchLabels
        value: {app: muster}
      - op: replace
        path: /spec/egress/0/ports/0/port
        value: 8105
      # stt-cohere's pods and port.
      - op: replace
        path: /spec/egress/2/to/0/podSelector/matchLabels
        value: {app: muster-stt-cohere}
      # Contacts (optional): the contacts plugin's internal port, appended
      # last so the patches by index above keep their targets.
      - op: add
        path: /spec/egress/-
        value:
          to:
            - podSelector:
                matchLabels: {app.kubernetes.io/name: muster-contacts}
          ports:
            - {protocol: TCP, port: 8081}
      # The recording (optional): the store's address and port, last.
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock: {cidr: 192.0.2.50/32}
          ports:
            - {protocol: TCP, port: 9000}
      # The post-call notes (optional): OpenRouter over HTTPS, and the mail
      # server's port, last. OpenRouter's edge has no fixed range: a real
      # tenant writes the public internet here (README "Post-call notes"),
      # not this documentation block.
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock: {cidr: 198.51.100.0/24}
          ports:
            - {protocol: TCP, port: 443}
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock: {cidr: 192.0.2.60/32}
          ports:
            - {protocol: TCP, port: 587}
  # The recording (optional): Egress uploads to the same store, and only to it.
  - target: {kind: NetworkPolicy, name: egress}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock: {cidr: 192.0.2.50/32}
          ports:
            - {protocol: TCP, port: 9000}
  # A Secret under another name (here, the TURN certificate's).
  - target: {kind: Deployment, name: livekit}
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/secret/secretName
        value: example-turn-certificate
