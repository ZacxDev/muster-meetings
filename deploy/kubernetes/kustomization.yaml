# muster-meetings, phase 2c: the plugin and LiveKit (TURN over TLS only),
# for muster's own namespace. A BASE: it carries no real hostname, address,
# NodePort or namespace. A tenant overlay sets them (see deploy/example-overlay and
# the README's "Deploying" section):
#
#   - hostnames, muster's address, trusted proxies, the client-IP header:
#     the `muster-meetings-params` ConfigMap (configMapGenerator, behavior: merge)
#   - the namespace: `namespace:`
#   - the image: `images:` (pin a digest)
#   - the NodePorts, the PVC's StorageClass, Secret names, and the
#     NetworkPolicies' selectors for muster and the ingress controller: patches
#
# Phase 3a adds Egress (track egress to the plugin's ingest) and its own
# small Redis (egress.yaml).
#
# Not here: the STT services (the utterance engine calls muster's own
# stt-cohere), Ingress/IngressRoute objects (the cluster's ingress is the
# tenant's), and the public 443 SNI passthrough for TURN (an operator step;
# see the README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: muster-meetings
    includeSelectors: false

resources:
  - muster-meetings.yaml
  - livekit.yaml
  - egress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: muster-meetings-params
    literals:
      # Where the plugin calls muster: its Service, FULLY QUALIFIED with the
      # trailing dot (<svc>.<ns>.svc.<cluster-domain>.). Plain http is allowed
      # only in that form: without the dot, ndots:5 sends the name through
      # the node's search domains first.
      - muster-url=http://muster.muster-tenant.svc.cluster.local.:8105
      # The cluster's DNS domain that rule checks.
      - cluster-domain=cluster.local
      # muster's origin as browsers see it (the only page that may frame the app).
      - muster-origin=https://muster.example.test
      # The three ONE-LABEL hosts (a free edge certificate covers one level):
      # meet-<x>.<domain>, never <x>.meet.<domain>.
      - public-url=https://meet-muster.example.test
      - livekit-url=wss://meet-rtc-muster.example.test
      - turn-domain=meet-turn-muster.example.test
      # The ingress in front of the plugin (comma-separated CIDRs) and, behind
      # a CDN, the one header carrying the client's address. Both empty: the
      # peer address is counted (no proxy declared).
      - trusted-proxies=
      - client-ip-header=
      # The transcript's engine: utterance (each pause-cut utterance to the
      # STT service muster's dictation uses), or off. Its service, by its
      # Service name in muster's namespace.
      - stt-engine=utterance
      - stt-url=http://stt-cohere:8000
      # The nemotron engine's Nemotron server (muster's stt-nemotron image),
      # by its Service name: read only with stt-engine=nemotron, which also
      # needs stt-url (its fallback) and MEETINGS_STREAM_STT_TOKEN in the
      # Secret, or the plugin refuses to boot.
      - stream-stt-url=ws://stt-nemotron:8000/v1/stream
      # Contacts (optional): the contacts plugin's INTERNAL listener, e.g.
      # http://muster-contacts:8081. Empty: no guest card, meetings exactly
      # as without contacts. Set it together with MEETINGS_CONTACTS_TOKEN in
      # the Secret AND the NetworkPolicy patch that lets the plugin reach it
      # (README "Contacts (optional)"; deploy/example-overlay shows both).
      - contacts-url=
      # The recording (optional): the store's API as the plugin and Egress
      # reach it (http(s)://host:port, no path) and the bucket. Both empty: no
      # recording, meetings exactly as before. Set them together with
      # MEETINGS_S3_ACCESS_KEY and MEETINGS_S3_SECRET_KEY in the Secret AND
      # the NetworkPolicy patches that let the plugin and Egress reach the
      # store (README "Recording (optional)"; deploy/example-overlay does it).
      - s3-endpoint=
      - s3-bucket=
      - s3-region=us-east-1
