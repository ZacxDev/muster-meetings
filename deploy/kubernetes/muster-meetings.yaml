# The plugin: one replica, Recreate (one SQLite writer), nonroot, read-only
# root filesystem; SQLite on a PVC, SQLite's temporary files on an emptyDir.
#
# Secrets it reads (create them before applying; names are patch targets):
#   muster-meetings  MUSTER_PLUGIN_TOKEN (from `muster-server app install`),
#                    MEETINGS_LINK_KEY (openssl rand -base64 32),
#                    MEETINGS_INGEST_SECRET (openssl rand -base64 32: the ingest
#                    URL tokens' key), MEETINGS_STT_TOKEN (a COPY of
#                    stt-cohere's one bearer: rotating it means updating both),
#                    and for the nemotron engine only MEETINGS_STREAM_STT_TOKEN
#                    (a COPY of stt-nemotron's STT_API_TOKEN; optional, so a
#                    Secret without it still boots the utterance engine)
#   livekit-keys     LIVEKIT_API_KEY, LIVEKIT_API_SECRET (shared with LiveKit)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: muster-meetings-state
  labels:
    app.kubernetes.io/name: muster-meetings
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: set by the overlay (a patch); unset uses the default.
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muster-meetings
  labels:
    app.kubernetes.io/name: muster-meetings
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: muster-meetings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muster-meetings
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: muster-meetings
          # :main moves with every green commit on main. An overlay MUST pin
          # a digest (or a released version) with `images:`, never run :main.
          image: ghcr.io/zacxdev/muster-meetings:main
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
            # Egress's websocket streams (the transcript's audio) and nothing
            # else; the NetworkPolicy admits Egress alone.
            - name: ingest
              containerPort: 8082
          env:
            - name: MUSTER_URL
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: muster-url}}
            - name: MEETINGS_CLUSTER_DOMAIN
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: cluster-domain}}
            - name: MUSTER_ORIGIN
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: muster-origin}}
            - name: MEETINGS_PUBLIC_URL
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: public-url}}
            - name: MEETINGS_LIVEKIT_URL
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: livekit-url}}
            - name: MEETINGS_TRUSTED_PROXIES
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: trusted-proxies}}
            - name: MEETINGS_CLIENT_IP_HEADER
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: client-ip-header}}
            - name: MEETINGS_LIVEKIT_API_URL
              value: http://livekit:7880
            - name: MEETINGS_LIVEKIT_ICE
              value: relay
            - name: STATE_DIR
              value: /state
            # The transcript (phase 3a): the engine, the STT service the
            # utterance engine calls (stt-cohere, as dictation does), and the
            # ingest Egress streams to. Phase 3c: the Nemotron server the
            # nemotron engine streams to (read only when stt-engine is
            # nemotron).
            - name: MEETINGS_STT_ENGINE
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: stt-engine}}
            - name: MEETINGS_STT_URL
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: stt-url}}
            - name: MEETINGS_STREAM_STT_URL
              valueFrom: {configMapKeyRef: {name: muster-meetings-params, key: stream-stt-url, optional: true}}
            - name: MEETINGS_INGEST_LISTEN
              value: ":8082"
            - name: MEETINGS_INGEST_URL
              value: ws://muster-meetings:8082
            - name: MUSTER_PLUGIN_TOKEN
              valueFrom: {secretKeyRef: {name: muster-meetings, key: MUSTER_PLUGIN_TOKEN}}
            - name: MEETINGS_LINK_KEY
              valueFrom: {secretKeyRef: {name: muster-meetings, key: MEETINGS_LINK_KEY}}
            - name: MEETINGS_INGEST_SECRET
              valueFrom: {secretKeyRef: {name: muster-meetings, key: MEETINGS_INGEST_SECRET}}
            - name: MEETINGS_STT_TOKEN
              valueFrom: {secretKeyRef: {name: muster-meetings, key: MEETINGS_STT_TOKEN}}
            - name: MEETINGS_STREAM_STT_TOKEN
              valueFrom: {secretKeyRef: {name: muster-meetings, key: MEETINGS_STREAM_STT_TOKEN, optional: true}}
            - name: LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: livekit-keys, key: LIVEKIT_API_KEY}}
            - name: LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: livekit-keys, key: LIVEKIT_API_SECRET}}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # The plugin judges every held person against muster BEFORE it
          # listens (up to 15 minutes when there are many), so the startup
          # probe allows that long.
          startupProbe:
            httpGet: {path: /healthz, port: internal}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /healthz, port: internal}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: internal}
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: muster-meetings-state
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# :8080 is public (route meet-<x>.<domain> to it). :8081 is internal:
# /healthz and LiveKit's webhook; never route it, and the NetworkPolicy admits
# only LiveKit to it. :8082 is the ingest, Egress's alone: never route it.
apiVersion: v1
kind: Service
metadata:
  name: muster-meetings
  labels:
    app.kubernetes.io/name: muster-meetings
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: muster-meetings
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: internal
      port: 8081
      targetPort: internal
    - name: ingest
      port: 8082
      targetPort: ingest
