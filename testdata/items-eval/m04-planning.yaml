segments:
  - {id: 399, speaker: Ada, text: "Welcome back everyone. Last sprint we shipped eleven of the fourteen stories we planned, which is our best number in a while, and the three we carried over are small."}
  - {id: 400, speaker: Mo, text: "Nice. The demo on Friday went really well too, the support folks were very happy about the new filters, they said it saves them about an hour a day."}
  - {id: 401, speaker: Ada, text: "Okay, sprint planning. We have three big things: the search rewrite, the onboarding emails, and the billing page."}
  - {id: 402, speaker: Kai, text: "For search, I'd like to start with the indexing pipeline. I'll write the design doc for it by Wednesday."}
  - {id: 403, speaker: Lena, text: "Should we also cover typo tolerance this sprint, or is that the next one?"}
  - {id: 404, speaker: Ada, text: "Next one. Let's keep the scope tight."}
  - {id: 405, speaker: Mo, text: "For the onboarding emails I need the copy. Lena, can you get the copy from marketing by Tuesday?"}
  - {id: 406, speaker: Lena, text: "Sure, I'll chase marketing for it and have the copy to you on Tuesday."}
  - {id: 407, speaker: Ada, text: "Billing page. We could maybe redo the whole thing in the new component library, but that's probably too big."}
  - {id: 408, speaker: Mo, text: "Agreed, too big. I'll just fix the layout bugs on the existing billing page this sprint."}
  - {id: 409, speaker: Kai, text: "I already filed those layout bugs last week, there are six of them."}
  - {id: 410, speaker: Ada, text: "Thanks Kai. I'll set up the sprint board right after this and add everything."}
  - {id: 411, speaker: Lena, text: "And I'll do the release checklist again. Oh wait, no, that rotates to Kai's team now, so not me."}
  - {id: 412, speaker: Kai, text: "Right, it's ours now. I'll put someone from my team on the release checklist."}
  - {id: 413, speaker: Ada, text: "Good. So recap: Kai has the design doc Wednesday, Lena has the copy Tuesday, and Mo has the layout bugs."}
  - {id: 414, speaker: Lena, text: "Do we want a mid-sprint check-in?"}
  - {id: 415, speaker: Ada, text: "Let's skip it this time. Thanks everyone."}
