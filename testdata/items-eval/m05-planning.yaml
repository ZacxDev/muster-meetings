id: m05
kind: planning
title: Spring launch planning
speakers:
  - {name: Nia}
  - {name: Oren}
  - {name: Pia}
segments:
  - {id: 499, speaker: Nia, text: "Thanks for joining. The spring launch is our biggest one this year, and the leadership team is excited about it, so I want us to have a clear plan before we leave."}
  - {id: 500, speaker: Pia, text: "Sounds good. I looked at what we did for the autumn launch, and the biggest lesson was that the landing page came together too late, everything else waited on it."}
  - {id: 501, speaker: Nia, text: "Let's plan the spring launch. The date is the fourteenth. What do we need?"}
  - {id: 502, speaker: Oren, text: "A landing page, the announcement post, and the email to existing users."}
  - {id: 503, speaker: Pia, text: "I can take the landing page. I'll have a first version on staging by Friday."}
  - {id: 504, speaker: Nia, text: "Great. Oren, can you write the announcement post?"}
  - {id: 505, speaker: Oren, text: "Yes, I'll draft the announcement and share it on Monday."}
  - {id: 506, speaker: Pia, text: "Did we ever get the final screenshots from design?"}
  - {id: 507, speaker: Nia, text: "I got them yesterday and already put them in the shared folder."}
  - {id: 508, speaker: Oren, text: "What if we did a short video too? It might be nice, but I'm not sure we have the time."}
  - {id: 509, speaker: Nia, text: "Let's not commit to a video yet."}
  - {id: 510, speaker: Nia, text: "For the email, I'll write it myself and send the draft to legal next Wednesday."}
  - {id: 511, speaker: Pia, text: "We could also try a referral promo, maybe, if the budget allows."}
  - {id: 512, speaker: Oren, text: "I'll set up the tracking links for all three. Actually, hold on, analytics does that now, so I won't."}
  - {id: 513, speaker: Nia, text: "Right, analytics has it. Pia, remember the staging version by Friday so we can review it."}
  - {id: 514, speaker: Pia, text: "Yep, staging by Friday."}
  - {id: 515, speaker: Nia, text: "Great, thanks both."}
labels:
