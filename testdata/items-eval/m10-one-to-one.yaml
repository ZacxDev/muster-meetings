segments:
  - {id: 999, speaker: Bo, text: "Before we start, how was the long weekend? I remember you said you were going hiking up north with your sister if the weather held up."}
  - {id: 1000, speaker: Cleo, text: "It was great, the weather was perfect. We did the lake loop on Saturday, about eighteen kilometres, and my legs are still a little sore today, but it was worth it."}
  - {id: 1001, speaker: Bo, text: "Hey Cleo, how's the week going so far?"}
  - {id: 1002, speaker: Cleo, text: "Pretty good. I finished the onboarding project on Tuesday, so I have more room now."}
  - {id: 1003, speaker: Bo, text: "Great work on that. Have you thought about what you want to pick up next?"}
  - {id: 1004, speaker: Cleo, text: "I'd like to try leading something. Maybe the performance work, if that's open?"}
  - {id: 1005, speaker: Bo, text: "It is. Could you write up your goals for it and send them to me before our next one-to-one?"}
  - {id: 1006, speaker: Cleo, text: "Yes, I'll write them up."}
  - {id: 1007, speaker: Bo, text: "And I'll introduce you to the infra team lead this week, so you have some context."}
  - {id: 1008, speaker: Cleo, text: "Thanks. Also, I was going to ask about the conference in May."}
  - {id: 1009, speaker: Bo, text: "We could probably fund one person, but I'd need to check the budget first."}
  - {id: 1010, speaker: Cleo, text: "No worries. I'll pair with you on the budget sheet on Friday then."}
  - {id: 1011, speaker: Bo, text: "Sure, Friday works for me."}
  - {id: 1012, speaker: Bo, text: "Anything bothering you lately?"}
  - {id: 1013, speaker: Cleo, text: "Not really. I'll ask IT for a new monitor, actually no, they already shipped one, ignore that."}
  - {id: 1014, speaker: Bo, text: "Ha, good. So, the goals doc from you before next time, and the intro from me this week."}
  - {id: 1015, speaker: Cleo, text: "Sounds good, thanks Bo."}
