  - {id: 1099, speaker: Dev, text: "Hey, thanks for moving this to the afternoon. The morning was back to back with interviews, I think we saw five candidates for the platform role today."}
  - {id: 1100, speaker: Eli, text: "No problem. How did the interviews go? I heard from Gus that at least one of them had a really strong background in distributed systems."}
  - {id: 1101, speaker: Dev, text: "Hi Eli. I wanted to talk about the on-call rotation and your promotion packet."}
  - {id: 1102, speaker: Eli, text: "Sure. On-call has been rough, honestly. I got paged six times last week."}
  - {id: 1103, speaker: Dev, text: "That's too many. I'll move two of the noisy alerts to business hours by Monday."}
  - {id: 1104, speaker: Eli, text: "That would help a lot. Should I keep the weekend shift too?"}
  - {id: 1105, speaker: Dev, text: "No, let's swap it. Eli, can you trade the weekend shift with Fay?"}
  - {id: 1106, speaker: Eli, text: "Yes, I'll ask Fay today."}
  - {id: 1107, speaker: Dev, text: "For the promotion packet, I already reviewed your first draft."}
  - {id: 1108, speaker: Dev, text: "Could you add two examples of cross-team work and send it back by the end of next week?"}
  - {id: 1109, speaker: Eli, text: "Sure, I'll add the examples and send it back by next Friday."}
  - {id: 1110, speaker: Eli, text: "Maybe I could also get a peer review from Gus, if he has time."}
  - {id: 1111, speaker: Dev, text: "Good idea, think about it."}
  - {id: 1112, speaker: Dev, text: "I'll write your peer feedback request. Oh, actually that goes through HR now, so I can't."}
  - {id: 1113, speaker: Eli, text: "Okay. Thanks Dev, this was useful."}
